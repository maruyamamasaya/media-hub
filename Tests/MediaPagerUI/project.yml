name: PagerPreview
options:
  bundleIdPrefix: personal.mediahub
  deploymentTarget:
    iOS: '17.0'
targets:
  PagerPreview:
    type: application
    platform: iOS
    sources:
      - App.swift
      - MediaPager.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: personal.mediahub.pager-preview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: '5.0'
  PagerPreviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PagerUITests.swift
    dependencies:
      - target: PagerPreview
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PagerPreview
schemes:
  PagerPreview:
    build:
      targets:
        PagerPreview: all
        PagerPreviewUITests: [test]
    test:
      targets: [PagerPreviewUITests]
